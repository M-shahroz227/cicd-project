name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: echo "Building HTML application"

      - name: Run Tests
        run: bash tests/test.sh

      - name: Success
        run: echo "All tests passed!"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy Website Using AWS SSM
        env:
          EC2_INSTANCE_ID: i-0b8d05a87aa87e5e1
        run: |
          export CONTENT_B64="$(base64 -w 0 index.html)"

          python3 - <<'PY'
          import json
          import os

          content = os.environ["CONTENT_B64"]

          commands = [
              f"printf '%s' '{content}' | base64 -d | sudo tee /usr/share/nginx/html/index.html > /dev/null",
              "sudo systemctl restart nginx",
              "curl -I http://localhost",
              "echo 'Deployment completed successfully!'"
          ]

          with open("/tmp/ssm-parameters.json", "w") as file:
              json.dump({"commands": commands}, file)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions CI/CD deployment" \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out!"
          exit 1